<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  html, body { width: 1280px; height: 240px; background: transparent; }
  body { display: flex; align-items: center; padding: 0 8px; }
  h1 { font-size: 76px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.12; }
  @media (prefers-color-scheme: dark) {
    h1 { color: #f0f3f6; }
    .t { background: color-mix(in srgb, var(--c) 26%, transparent); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 40%, transparent); }
  }
</style>
</head>
<body>
  <h1>Your <span class="t" style="--c:var(--hot)"><span>📥</span></span> inbox, <span class="t" style="--c:var(--meh)"><span>🗑️</span></span> promos and<br><span class="t" style="--c:var(--ping)"><span>↩️</span></span> follow-ups, <span class="t" style="--c:var(--stash)"><span>✨</span></span> handled on their own.</h1>
</body>
</html>
